<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1 id="head">Rocket launching by 103 and 102 Students</h1>
<img id="img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0qCYbQDpasL6Vg-pGhMpqs3VPB1m0kyALvtVFZTJGVQ&s">
<h1 id="timer">Rocket Launching in just</h1>
<video id="vd" src="videorocket.mp4" style="display: none;" controls></video>
<script>
    let head=document.getElementById("head");
   let  img=document.getElementById("img");
   let timer=document.getElementById("timer");
   let vd=document.getElementById("vd");
   let count=10;
   let time=setInterval(()=>
   {
     count --;
    timer.textContent="Rocket Launching in just"+count+"seconds";
    if(count===0)
   {
    clearInterval(time);
    vd.style.display="block";
    img.style.display="none";
    vd.src="videorocket.mp4";
    vd.play();
   }
   },1000)
</script>
</script>
</body>
</html>
