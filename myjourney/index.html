
<!DOCTYPE html>
<html>
<head>
    <title>Childhood to Adulthood</title>

    <style>
        body {
            text-align: center;
            background: black;
            color: white;
            font-family: Arial;
        }

        h1 {
            margin-top: 40px;
            color: pink;
        }

        img {
            width: 300px;
            height: 350px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 0 20px pink;
        }

        .animate {
            animation: zoom 2s ease;
        }

        @keyframes zoom {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <h1 id="head">❤️ My Life Journey ❤️</h1>

    <img id="img" src="c:\Users\91970\Downloads\ch.jpeg">

    <h2 id="text">Childhood Days 👶</h2>

    <script>

        let img = document.getElementById("img");
        let head = document.getElementById("head");
        let text = document.getElementById("text");

        let photos = [
            "photos/childhood.jpg",
            "photos/child.jpeg",
            "photos/innocent.jpeg",
            "photos/teenage.jpeg",
            "photos/inter.jpeg",
            "photos/btech.jpeg",
            "photos/hostel life.jpeg",
            "photos/growedup.jpeg",
            "photos/grownup.jpeg"
        ];

        let captions = [
            "Childhood Days 👶",
            "My School Memories 🎒",
            "Innocent Days ❤️",
            "Teenage Memories 😊",
            "Intermediate Days 📚",
            "College Life 🎓",
            "hostel life 🥹",
            "grownup ❤️",
            "Welcome to Adulthood ✨"
        ];

        let count = 0;

        let time = setInterval(() => {

            count++;

            if (count < photos.length) {

                img.classList.remove("animate");

                img.src = photos[count];

                text.textContent = captions[count];

                void img.offsetWidth;

                img.classList.add("animate");

            }

            else {

                clearInterval(time);

                head.textContent = "❤️ Childhood to Adulthood ❤️";

                text.textContent =
                "From a little kid to a grown-up. Memories stay forever!";

            }

        }, 3000);

    </script>

</body>
</html>
